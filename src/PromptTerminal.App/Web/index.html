<!doctype html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'none'; frame-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'">
  <title>Prompt Terminal</title>
  <link rel="icon" type="image/svg+xml" href="app-icon.svg">
  <link rel="stylesheet" href="vendor/xterm.css">
  <link rel="stylesheet" href="workspace.css">
  <script defer src="vendor/xterm.js"></script>
  <script defer src="vendor/addon-fit.js"></script>
  <script defer src="vendor/addon-search.js"></script>
  <script defer src="vendor/addon-serialize.js"></script>
  <script defer src="vendor/addon-web-links.js"></script>
  <script defer src="workspace.js"></script>
</head>
<body>
  <header class="app-header">
    <div class="brand"><img class="brand-icon" src="app-icon.svg" alt="" width="40" height="40"><div>Prompt Terminal<small>Independent shells. One workspace.</small></div></div>
    <div class="header-actions">
      <button class="primary" data-action="startWorkspace" title="Review commands before starting stopped panes">Start workspace</button>
      <button data-action="palette" title="Command palette (Ctrl+Shift+P)">Commands</button>
      <details class="menu">
        <summary>Workspace</summary>
        <div class="menu-items">
          <button data-action="save">Save now</button>
          <button data-action="import">Open layout...</button>
          <button data-action="export">Export layout without scripts...</button>
          <button data-action="exportScripts">Export with scripts/environment...</button>
          <button data-action="recover">Recover backup...</button>
          <button data-action="profiles">Launch profiles...</button>
          <button data-action="settings">Appearance and shortcuts...</button>
          <button data-action="help">Help and safety</button>
        </div>
      </details>
    </div>
  </header>
  <nav class="tabs-bar" aria-label="Workspaces">
    <div id="tabs" role="tablist" aria-label="Workspace tabs"></div>
    <button class="new-tab" data-action="newTab" aria-label="New tab" title="New tab (Ctrl+Shift+T)">+</button>
    <button data-action="tabOptions" title="Rename, color, reorder, duplicate or close this tab">Tab options</button>
  </nav>
  <div class="toolbar" role="toolbar" aria-label="Workspace actions">
    <button data-action="newPane">+ Pane</button>
    <button data-action="splitHorizontal" title="Split right (Ctrl+Shift+H)">Split right</button>
    <button data-action="splitVertical" title="Split below (Ctrl+Shift+J)">Split below</button>
    <span class="toolbar-rule"></span>
    <button data-action="toggleFloat" title="Float or dock active pane (Ctrl+Shift+F)">Float / dock</button>
    <button data-action="maximize" title="Maximize or restore (Ctrl+Shift+M)">Maximize</button>
    <button data-action="search">Search</button>
    <span class="toolbar-rule"></span>
    <button data-action="templates">Templates</button>
    <button data-action="snippets">Snippets</button>
    <button data-action="worktree">Git worktree</button>
    <button data-action="broadcast" class="broadcast-button">Broadcast...</button>
    <button data-action="settings" class="settings-button">Settings</button>
  </div>
  <div id="broadcast-banner" class="broadcast-warning" role="status" hidden>BROADCAST MODE - only explicitly checked sessions receive the deliberate send.</div>
  <section id="search-bar" class="search-bar" aria-label="Terminal search" hidden>
    <label for="search-query">Search active terminal</label>
    <input id="search-query" type="search" autocomplete="off">
    <button data-action="searchPrevious" aria-label="Previous search match">Previous</button>
    <button data-action="searchNext" aria-label="Next search match">Next</button>
    <span id="search-result" role="status"></span>
    <button data-action="closeSearch" aria-label="Close search">Close</button>
  </section>
  <main id="workspaces" aria-label="Terminal workspaces"></main>
  <footer>
    <span id="save-status" role="status">Connecting to desktop host...</span>
    <span class="footer-hint">Local configuration | Restored sessions never auto-start | Alt+drag a floating pane to preview docking</span>
    <button data-action="fontSmaller" aria-label="Decrease terminal font size">A-</button>
    <button data-action="fontLarger" aria-label="Increase terminal font size">A+</button>
  </footer>
  <div id="notices" aria-live="polite" aria-label="Notifications"></div>
  <dialog id="app-dialog" aria-labelledby="dialog-title">
    <form id="dialog-form">
      <header class="dialog-header"><h1 id="dialog-title"></h1><button type="button" data-dialog-close aria-label="Close dialog">x</button></header>
      <p id="dialog-intro"></p>
      <div id="dialog-body"></div>
      <p id="dialog-error" role="alert" hidden></p>
      <div class="dialog-buttons"><button type="button" data-dialog-close>Cancel</button><button id="dialog-submit" type="submit" class="primary">Save</button></div>
    </form>
  </dialog>
</body>
</html>
